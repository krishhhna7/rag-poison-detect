# Main experiment config (cluster / 24GB GPU). Override on the CLI: --set generator.hf_id=Qwen/Qwen2.5-3B-Instruct
run_name: nq_qwen7b_contriever
seed: 0
paths:
  workspace: "${RAGDET_ROOT}"        # set to the large-storage area on the cluster
data:
  dataset: nq                        # nq | hotpotqa | toy
  corpus_path: "${RAGDET_DATA}/nq/corpus.jsonl"       # BEIR-format corpus (see README)
  qrels_path: "${RAGDET_ROOT}/data_small/nq/qrels_test.tsv"       # BEIR qrels: maps query id -> gold passages
  targets_path: "${RAGDET_ROOT}/data_small/nq/targets.json"       # PoisonedRAG release file (see README)
  n_targets: 100
  corpus_size: 100000                # sub-corpus = gold + random distractors (documented limitation)
retriever:
  name: contriever                   # contriever | bge | hashing
  hf_id: facebook/contriever
  pooling: mean
  normalize: false
  top_k: 5
generator:
  hf_id: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  max_new_tokens: 24
  load_4bit: false
  attn_layers: last_half
ppl:
  hf_id: gpt2
attack:
  n_poison: 3                        # main setting: mixed poison/clean top-5. Ablate over {1, 5}; released texts give at most 5
  use_released_poison: true          # A0 uses PoisonedRAG's released poison texts
  prepend_question: true             # black-box: question text + poison text
  n_candidates: 8                    # rewrites per slot for A1/A2
detector:
  model: logreg                      # logreg | gbdt
  fpr_target: 0.05                   # 1% is not calibratable with ~100 clean passages; see README
eval:
  seeds: [0, 1, 2]
  n_boot: 1000
  k_folds: 5                         # cross-fitting: fit on 3 folds, calibrate on 1, test on 1 (split by question)
  ablations: true                    # also evaluate fusion with one signal group removed
  filter_detectors: [fusion, sem, internal, ppl_filter]
  train_tiers: [A0]
  test_tiers: [A0, A1, A2]
